// Tab Click Scroll to Top for Firefox — version 2.0
// Simplified build: one immediate scroll-to-top action on re-clicking
// the already-selected tab. No URL/fragment detection and no delayed retries.

(function () {
  "use strict";

  const PREFIX = "[Tab Click Scroll to Top]";
  const Cc = Components.classes;
  const Ci = Components.interfaces;

  const MSG_READY = "TabClickScrollToTop:Ready";
  const MSG_SCROLL = "TabClickScrollToTop:Scroll";
  const MSG_RESULT = "TabClickScrollToTop:Result";

  const frameScriptSource = `
    (function () {
      "use strict";
      const READY = ${JSON.stringify(MSG_READY)};
      const SCROLL = ${JSON.stringify(MSG_SCROLL)};
      const RESULT = ${JSON.stringify(MSG_RESULT)};

      // Install in every frame in this tab. Some sites put the primary
      // scrollable view inside an iframe rather than the top-level document.

      if (!globalThis.__tabClickScrollTopFrameScriptInstalledV20) {
        globalThis.__tabClickScrollTopFrameScriptInstalledV20 = true;

        // Trusted user input cancels an in-progress scroll animation.
        let activeScrollJob = null;

        function isEditableTarget(target) {
          try {
            if (!target) return false;
            if (target.isContentEditable) return true;
            const name = String(target.localName || "").toLowerCase();
            return name === "input" || name === "textarea" || name === "select";
          } catch (_) {
            return false;
          }
        }

        function cancelPendingScrollForUserInput(event) {
          try {
            if (!activeScrollJob || !event || event.isTrusted === false) return;

            if (event.type === "pointerdown" && event.button === 2) return;

            if (event.type === "keydown") {
              if (isEditableTarget(event.target)) return;
              const scrollKeys = new Set([
                "ArrowDown", "ArrowUp", "PageDown", "PageUp", "Home", "End", " ", "Spacebar"
              ]);
              if (!scrollKeys.has(event.key)) return;
            }

            // Wheel covers mouse wheels and touchpad scrolling; touchmove covers
            // finger gestures. Keyboard scrolling is handled above.
            activeScrollJob.cancelled = true;
          } catch (_) {}
        }

        try {
          content.addEventListener("wheel", cancelPendingScrollForUserInput, { capture: true, passive: true });
          content.addEventListener("touchmove", cancelPendingScrollForUserInput, { capture: true, passive: true });
          content.addEventListener("pointerdown", cancelPendingScrollForUserInput, true);
          content.addEventListener("keydown", cancelPendingScrollForUserInput, true);
        } catch (_) {}

        addMessageListener(SCROLL, function () {
          try {
            if (activeScrollJob) activeScrollJob.cancelled = true;
            const job = { cancelled: false };
            activeScrollJob = job;

            const win = content;
            if (!win || win.closed || !win.document) {
              sendAsyncMessage(RESULT, { ok: false, reason: "content document unavailable" });
              return;
            }

            const doc = win.document;
            const root = doc.scrollingElement || doc.documentElement || doc.body;
            const SCROLL_DURATION_MS = 140; // lower = faster; 100–180 ms is a good range

            function temporarilyDisableSmooth(element) {
              if (!element || !element.style) return function () {};
              let oldValue = "";
              let oldPriority = "";
              try {
                oldValue = element.style.getPropertyValue("scroll-behavior");
                oldPriority = element.style.getPropertyPriority("scroll-behavior");
                element.style.setProperty("scroll-behavior", "auto", "important");
              } catch (_) {}
              return function () {
                try {
                  if (oldValue) element.style.setProperty("scroll-behavior", oldValue, oldPriority);
                  else element.style.removeProperty("scroll-behavior");
                } catch (_) {}
              };
            }

            function animateElementToTop(element, duration, job) {
              try {
                if (!element || !element.isConnected) return false;
                const start = Number(element.scrollTop || 0);
                if (!(start > 1)) return false;
                const restoreStyle = temporarilyDisableSmooth(element);
                const startedAt = win.performance && win.performance.now ? win.performance.now() : Date.now();

                function tick(now) {
                  try {
                    if (job.cancelled || activeScrollJob !== job) {
                      restoreStyle();
                      return;
                    }
                    const elapsed = Math.max(0, now - startedAt);
                    const progress = Math.min(1, elapsed / duration);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    element.scrollTop = progress >= 1 ? 0 : Math.max(0, start * (1 - eased));
                    if (progress < 1 && element.scrollTop > 0.5) {
                      win.requestAnimationFrame(tick);
                    } else {
                      element.scrollTop = 0;
                      restoreStyle();
                    }
                  } catch (_) {
                    try { element.scrollTop = 0; } catch (__) {}
                    restoreStyle();
                  }
                }

                win.requestAnimationFrame(tick);
                return true;
              } catch (_) {
                try { element.scrollTop = 0; } catch (__) {}
                return false;
              }
            }

            function animatePageToTop(duration, job) {
              try {
                const pageStart = Math.max(
                  Number(win.scrollY || 0),
                  Number(root && root.scrollTop || 0)
                );
                if (!(pageStart > 1)) return false;

                const restoreStyle = temporarilyDisableSmooth(root);
                const startedAt = win.performance && win.performance.now ? win.performance.now() : Date.now();
                function tick(now) {
                  try {
                    if (job.cancelled || activeScrollJob !== job) {
                      restoreStyle();
                      return;
                    }
                    const elapsed = Math.max(0, now - startedAt);
                    const progress = Math.min(1, elapsed / duration);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const y = progress >= 1 ? 0 : Math.max(0, pageStart * (1 - eased));
                    try { if (root) root.scrollTop = y; } catch (_) {}
                    try { win.scrollTo(0, y); } catch (_) {}
                    if (progress < 1 && (Number(win.scrollY || 0) > 0.5 || Number(root && root.scrollTop || 0) > 0.5)) {
                      win.requestAnimationFrame(tick);
                    } else {
                      try { if (root) root.scrollTop = 0; } catch (_) {}
                      try { win.scrollTo(0, 0); } catch (_) {}
                      restoreStyle();
                    }
                  } catch (_) {
                    try { if (root) root.scrollTop = 0; } catch (__) {}
                    try { win.scrollTo(0, 0); } catch (__) {}
                    restoreStyle();
                  }
                }
                win.requestAnimationFrame(tick);
                return true;
              } catch (_) {
                try { if (root) root.scrollTop = 0; } catch (__) {}
                try { win.scrollTo(0, 0); } catch (__) {}
                return false;
              }
            }

            function isScrollableElement(element) {
              try {
                if (!element || !element.isConnected) return false;
                if (element.scrollHeight <= element.clientHeight + 1) return false;
                const overflowY = win.getComputedStyle(element).overflowY;
                return overflowY === "auto" || overflowY === "scroll" ||
                  overflowY === "hidden" || overflowY === "overlay";
              } catch (_) {
                return false;
              }
            }

            function collectNestedScrollers() {
              const found = [];
              const seen = new Set([root, doc.documentElement, doc.body]);
              let elements = [];
              try { elements = doc.querySelectorAll("*"); } catch (_) {}
              for (const element of elements) {
                try {
                  if (seen.has(element) || !isScrollableElement(element)) continue;
                  seen.add(element);
                  found.push(element);
                } catch (_) {}
              }
              return found;
            }

            function scrollSweep(duration, job) {
              // The document viewport is handled independently of nested scrollers.
              animatePageToTop(duration, job);
              const nested = collectNestedScrollers();
              for (const element of nested) animateElementToTop(element, duration, job);
              // Body/documentElement can be independently scrollable on some layouts.
              if (doc.documentElement && doc.documentElement !== root) {
                animateElementToTop(doc.documentElement, duration, job);
              }
              if (doc.body && doc.body !== root && doc.body !== doc.documentElement) {
                animateElementToTop(doc.body, duration, job);
              }
              return nested.length;
            }

            // Perform one immediate scroll sweep. No URL-specific logic,
            // delayed retries, or anchor-position correction is used.
            const nestedCount = scrollSweep(SCROLL_DURATION_MS, job);

            sendAsyncMessage(RESULT, {
              ok: true,
              url: String(doc.location && doc.location.href || ""),
              nestedContainers: nestedCount,
              pageY: Number(win.scrollY || 0),
              rootTag: root && root.localName || "unknown"
            });
          } catch (error) {
            sendAsyncMessage(RESULT, { ok: false, error: String(error && error.stack || error) });
          }
        });
      }

      // Send READY every time the chrome side loads this script. This allows it
      // to detect a fresh content process after a site/process switch.
      sendAsyncMessage(READY, { ok: true, url: String(content.location && content.location.href || "") });
    })();
  `;

  const FRAME_SCRIPT_URL = "data:application/javascript," + encodeURIComponent(frameScriptSource);

  const LOG_ENABLED = false; // Set to true temporarily for troubleshooting.

  function log(message) {
    if (!LOG_ENABLED) return;
    try {
      Cc["@mozilla.org/consoleservice;1"]
        .getService(Ci.nsIConsoleService)
        .logStringMessage(`${PREFIX} ${message}`);
    } catch (_) {
      try { dump(`${PREFIX} ${message}\n`); } catch (__) {}
    }
  }

  function report(error, where) {
    log(`ERROR${where ? ` (${where})` : ""}: ${error && error.stack ? error.stack : error}`);
  }

  function nodeLabel(node) {
    if (!node) return "null";
    const name = node.localName || node.nodeName || Object.prototype.toString.call(node);
    let cls = "";
    try {
      if (node.classList && node.classList.length) {
        cls = "." + Array.from(node.classList).slice(0, 3).join(".");
      }
    } catch (_) {}
    return `${name}${cls}`;
  }

  function getParentAcrossShadow(node) {
    try {
      if (node.parentNode) return node.parentNode;
      const root = node.getRootNode && node.getRootNode();
      return root && root.host ? root.host : null;
    } catch (_) {
      return null;
    }
  }

  function installInWindow(win) {
    try {
      if (!win || win.closed || !win.gBrowser || win.__tabClickScrollTopV20) return;

      const tabContainer = win.gBrowser.tabContainer;
      if (!tabContainer) {
        log("browser window found, but gBrowser.tabContainer is missing");
        return;
      }

      win.__tabClickScrollTopV20 = true;
      const browserStates = new WeakMap();
      let lastLeftMouseDown = null;

      function findClickedTab(event) {
        let candidates = [];
        try {
          if (typeof event.composedPath === "function") candidates = event.composedPath();
        } catch (_) {}
        if (event.originalTarget) candidates.push(event.originalTarget);
        if (event.target) candidates.push(event.target);

        for (const candidate of candidates) {
          let node = candidate;
          const seen = new Set();
          while (node && node !== tabContainer && !seen.has(node)) {
            seen.add(node);
            let classList = null;
            try { classList = node.classList; } catch (_) {}

            if (classList && (
              classList.contains("tab-close-button") ||
              classList.contains("tab-close-button-container") ||
              classList.contains("tab-audio-button") ||
              classList.contains("tab-icon-overlay")
            )) {
              return { control: true, tab: null };
            }

            if (node.localName === "tab" || (classList && classList.contains("tabbrowser-tab"))) {
              return { control: false, tab: node };
            }
            node = getParentAcrossShadow(node);
          }
        }
        return { control: false, tab: null };
      }

      // Listen on the window during capture, before tab-strip handlers can switch tabs.
      const onMouseDown = event => {
        try {
          if (event.button !== 0 || event.isTrusted === false ||
              event.ctrlKey || event.shiftKey || event.altKey || event.metaKey) {
            lastLeftMouseDown = null;
            return;
          }

          const info = findClickedTab(event);
          if (info.control || !info.tab) {
            lastLeftMouseDown = null;
            return;
          }

          const snapshot = {
            clickedTab: info.tab,
            selectedBefore: win.gBrowser.selectedTab,
            timestamp: Date.now()
          };
          lastLeftMouseDown = snapshot;

          win.setTimeout(() => {
            if (lastLeftMouseDown === snapshot && Date.now() - snapshot.timestamp > 1200) {
              lastLeftMouseDown = null;
            }
          }, 1300);
        } catch (error) {
          lastLeftMouseDown = null;
          report(error, "mousedown handler");
        }
      };

      function requestScroll(tab) {
        try {
          const browser = tab.linkedBrowser || win.gBrowser.selectedBrowser;
          if (!browser) {
            log("selected tab has no linkedBrowser");
            return;
          }

          const mm = browser.messageManager;
          if (!mm) {
            log("selected browser has no messageManager");
            return;
          }

          let state = browserStates.get(browser);
          if (!state) {
            state = { mm, pending: false, requestNumber: 0, timer: null, listener: null };

            state.listener = {
              receiveMessage(message) {
                try {
                  if (message.name === MSG_READY) {
                    if (state.pending) {
                      state.pending = false;
                      if (state.timer) win.clearTimeout(state.timer);
                      state.timer = null;
                      state.mm.sendAsyncMessage(MSG_SCROLL, { requestNumber: state.requestNumber });
                      log(`scroll request sent to content process (request ${state.requestNumber})`);
                    }
                  } else if (message.name === MSG_RESULT) {
                    const result = message.json || message.data || {};
                    if (result.ok) {
                      log(`scroll command applied; nested containers=${result.nestedContainers || 0}; page=${result.url || "unknown"}`);
                    } else {
                      log(`content process could not scroll: ${result.error || result.reason || "unknown reason"}`);
                    }
                  }
                } catch (error) {
                  report(error, "message listener");
                }
              }
            };

            mm.addMessageListener(MSG_READY, state.listener);
            mm.addMessageListener(MSG_RESULT, state.listener);
            browserStates.set(browser, state);
          }

          // A new handshake on each click avoids stale READY state after process swaps.
          state.requestNumber++;
          state.pending = true;
          if (state.timer) win.clearTimeout(state.timer);
          const currentRequest = state.requestNumber;
          state.timer = win.setTimeout(() => {
            if (state.pending && state.requestNumber === currentRequest) {
              state.pending = false;
              log(`content process did not send READY within 4 seconds (request ${currentRequest})`);
            }
          }, 4000);

          mm.loadFrameScript(FRAME_SCRIPT_URL, true);
          log(`frame script handshake requested (request ${currentRequest})`);
        } catch (error) {
          report(error, "requestScroll");
        }
      }

      const onClick = event => {
        try {
          if (event.button !== 0 || event.isTrusted === false ||
              event.ctrlKey || event.shiftKey || event.altKey || event.metaKey) {
            return;
          }

          const info = findClickedTab(event);
          const mouseDown = lastLeftMouseDown;
          lastLeftMouseDown = null;

          if (info.control || !info.tab) return;
          if (!mouseDown || Date.now() - mouseDown.timestamp > 1200 || mouseDown.clickedTab !== info.tab) {
            log("click ignored: matching left mousedown on this tab was not recorded");
            return;
          }

          if (mouseDown.selectedBefore !== info.tab) {
            log(`click ignored: this tab was not selected at mousedown (clicked=${nodeLabel(info.tab)}, previously selected=${nodeLabel(mouseDown.selectedBefore)})`);
            return;
          }

          if (win.gBrowser.selectedTab !== info.tab) {
            log("click ignored: selected tab is no longer the clicked tab");
            return;
          }

          log(`re-click on already-selected tab detected: ${nodeLabel(info.tab)}`);
          win.setTimeout(() => {
            try {
              if (win.closed || !info.tab.isConnected || win.gBrowser.selectedTab !== info.tab) {
                log("tab changed before scroll; ignored");
                return;
              }
              requestScroll(info.tab);
            } catch (error) {
              report(error, "click timeout");
            }
          }, 0);
        } catch (error) {
          report(error, "click handler");
        }
      };

      win.addEventListener("mousedown", onMouseDown, true);
      tabContainer.addEventListener("click", onClick, true);

      win.addEventListener("unload", () => {
        try {
          win.removeEventListener("mousedown", onMouseDown, true);
          tabContainer.removeEventListener("click", onClick, true);
          delete win.__tabClickScrollTopV20;
        } catch (error) {
          report(error, "cleanup");
        }
      }, { once: true });

      log("click and mousedown listeners installed in a browser window");
    } catch (error) {
      report(error, "installInWindow");
    }
  }

  try {
    const windowMediator = Cc["@mozilla.org/appshell/window-mediator;1"]
      .getService(Ci.nsIWindowMediator);
    const observerService = Cc["@mozilla.org/observer-service;1"]
      .getService(Ci.nsIObserverService);

    const windows = windowMediator.getEnumerator("navigator:browser");
    while (windows.hasMoreElements()) installInWindow(windows.getNext());

    const startupObserver = {
      observe(subject, topic) {
        if (topic === "browser-delayed-startup-finished") installInWindow(subject);
      }
    };
    observerService.addObserver(startupObserver, "browser-delayed-startup-finished");
    log("AutoConfig loaded; waiting for browser windows");
  } catch (error) {
    report(error, "startup");
  }
})();
